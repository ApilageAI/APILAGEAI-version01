<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>401 — ApilageAI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: #ffffff;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* subtle moving lines background */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.03),
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 60px
    );
    animation: slide 40s linear infinite;
}

@keyframes slide {
    from { transform: translateX(0); }
    to { transform: translateX(-300px); }
}

.container {
    text-align: center;
    z-index: 2;
    padding: 40px;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.code {
    font-size: 90px;
    font-weight: 600;
    letter-spacing: 6px;
    margin-bottom: 20px;
}

p {
    font-size: 18px;
    margin: 8px 0;
    color: #333;
    animation: fade 5s ease-in-out infinite;
}

@keyframes fade {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
}

.button {
    margin-top: 35px;
    padding: 12px 28px;
    border: 1px solid #000;
    text-decoration: none;
    color: #000;
    display: inline-block;
    transition: all 0.3s ease;
    font-size: 14px;
    letter-spacing: 1px;
}

.button:hover {
    background: #000;
    color: #fff;
}
</style>
</head>

<body>

<div class="container">
    <div class="code">401</div>
    <p><strong>This space is private.</strong></p>
    <p>You’re close — but not authenticated.</p>

    <a href="/login" class="button">Sign In</a>
</div>

</body>
</html>
